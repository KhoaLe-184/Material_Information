<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPD FOOD - Raw Material Master Data & Lead Time Calculator</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
            }
          }
        }
      }
    }
  </script>

  <!-- React & React-DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Development / UMD -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS CDN (Thư viện đọc file Excel/CSV trực tiếp trên Browser) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current && window.lucide) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            attrs: { class: className },
            nameAttr: 'data-lucide',
            el: containerRef.current
          });
        }
      }, [name, className]);
      return <span ref={containerRef} className="inline-flex items-center justify-center"></span>;
    };

    const INITIAL_MATERIALS = [
      {
        id: 'MAT-10029',
        materialCode: 'MAT-10029',
        materialName: 'Titanium Alloy Rod Grade 5 (6Al-4V)',
        vendorNumber: 'VND-801',
        vendorName: 'Apex Metals & Alloys Corp',
        origin: 'Germany',
        packingSize: '20 Bars / Wooden Bundle',
        shelfLife: 1825,
        currentPrice: 420.50,
        moq: 100,
        leadTimeFC: 18,
        leadTimeNonFC: 35,
        lastUpdateDate: '2026-07-28',
        additionalNotes: 'Critical aerospace component. Subject to tariff adjustments.',
        category: 'Raw Metals',
        currentStock: 450,
        monthlyConsumption: 120,
        safetyStock: 80,
        forecastDemand: 130
      },
      {
        id: 'MAT-30411',
        materialCode: 'MAT-30411',
        materialName: 'High-Grade Polypropylene Resin Pellets',
        vendorNumber: 'VND-804',
        vendorName: 'PolymerTech Global Ltd',
        origin: 'South Korea',
        packingSize: '25 kg Moisture-proof Bag',
        shelfLife: 730,
        currentPrice: 2.85,
        moq: 5000,
        leadTimeFC: 12,
        leadTimeNonFC: 24,
        lastUpdateDate: '2026-07-30',
        additionalNotes: 'Food-grade certified. Store below 30°C.',
        category: 'Polymers',
        currentStock: 12500,
        monthlyConsumption: 6000,
        safetyStock: 3000,
        forecastDemand: 6500
      },
      {
        id: 'MAT-50920',
        materialCode: 'MAT-50920',
        materialName: 'Ceramic Capacitor 10uF 50V X7R 0805',
        vendorNumber: 'VND-809',
        vendorName: 'Nippon Precision Electronics',
        origin: 'Japan',
        packingSize: '4,000 pcs / Tape Reel',
        shelfLife: 1095,
        currentPrice: 0.08,
        moq: 20000,
        leadTimeFC: 30,
        leadTimeNonFC: 60,
        lastUpdateDate: '2026-06-15',
        additionalNotes: 'Global silicon shortage impacting non-FC lead times.',
        category: 'Electronics',
        currentStock: 18000,
        monthlyConsumption: 15000,
        safetyStock: 10000,
        forecastDemand: 16000
      }
    ];

    const getRiskStatus = (currentStock, monthlyConsumption, leadTimeFC, safetyStock) => {
      const dailyConsumption = monthlyConsumption / 30;
      if (dailyConsumption <= 0) return { label: 'Low Risk', color: 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20', badge: 'Low' };
      
      const daysOfSupply = currentStock / dailyConsumption;
      const reorderPointDays = leadTimeFC + (safetyStock / dailyConsumption);

      if (daysOfSupply <= leadTimeFC) {
        return { label: 'High Risk', color: 'bg-rose-500/10 text-rose-500 border-rose-500/20', badge: 'High' };
      } else if (daysOfSupply <= reorderPointDays + 15) {
        return { label: 'Medium Risk', color: 'bg-amber-500/10 text-amber-500 border-amber-500/20', badge: 'Medium' };
      } else {
        return { label: 'Low Risk', color: 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20', badge: 'Low' };
      }
    };

    function App() {
      const [materials, setMaterials] = useState(INITIAL_MATERIALS);
      const [activeTab, setActiveTab] = useState('directory'); 
      const [theme, setTheme] = useState('dark');
      const [userRole, setUserRole] = useState('Admin');
      
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedVendor, setSelectedVendor] = useState('All');
      const [selectedOrigin, setSelectedOrigin] = useState('All');
      const [sortBy, setSortBy] = useState('code');
      const [viewMode, setViewMode] = useState('table');

      const [calcSearchQuery, setCalcSearchQuery] = useState('');
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [isDetailOpen, setIsDetailOpen] = useState(false);

      const [calcMaterial, setCalcMaterial] = useState(INITIAL_MATERIALS[0]);
      
      const targetDeliveryStr = '2026-08-31';
      const defaultPrDateStr = '2026-08-06';

      const [calcInputs, setCalcInputs] = useState({
        requestedDeliveryDate: targetDeliveryStr,
        actualPrReceivedDate: defaultPrDateStr,
        orderType: 'FC',
        leadTimeFC: INITIAL_MATERIALS[0].leadTimeFC,
        leadTimeNonFC: INITIAL_MATERIALS[0].leadTimeNonFC
      });

      // Upload State & Refs
      const fileInputRef = useRef(null);
      const [uploadStatus, setUploadStatus] = useState({ type: '', message: '' });
      const [isDragging, setIsDragging] = useState(false);

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const vendorsList = useMemo(() => {
        const list = Array.from(new Set(materials.map(m => m.vendorName)));
        return ['All', ...list];
      }, [materials]);

      const originList = useMemo(() => {
        const list = Array.from(new Set(materials.map(m => m.origin)));
        return ['All', ...list];
      }, [materials]);

      const filteredMaterials = useMemo(() => {
        return materials.filter(m => {
          const matchesSearch =
            m.materialCode.toLowerCase().includes(searchQuery.toLowerCase()) ||
            m.materialName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            m.vendorName.toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesVendor = selectedVendor === 'All' || m.vendorName === selectedVendor;
          const matchesOrigin = selectedOrigin === 'All' || m.origin === selectedOrigin;

          return matchesSearch && matchesVendor && matchesOrigin;
        }).sort((a, b) => {
          if (sortBy === 'priceAsc') return a.currentPrice - b.currentPrice;
          if (sortBy === 'priceDesc') return b.currentPrice - a.currentPrice;
          if (sortBy === 'ltAsc') return a.leadTimeFC - b.leadTimeFC;
          if (sortBy === 'ltDesc') return b.leadTimeFC - a.leadTimeFC;
          if (sortBy === 'name') return a.materialName.localeCompare(b.materialName);
          return a.materialCode.localeCompare(b.materialCode);
        });
      }, [materials, searchQuery, selectedVendor, selectedOrigin, sortBy]);

      const calcFilteredMaterials = useMemo(() => {
        if (!calcSearchQuery.trim()) return materials;
        const q = calcSearchQuery.toLowerCase();
        return materials.filter(m =>
          m.materialCode.toLowerCase().includes(q) ||
          m.materialName.toLowerCase().includes(q) ||
          m.vendorName.toLowerCase().includes(q)
        );
      }, [materials, calcSearchQuery]);

      // Xử lý đọc file Excel / CSV
      const processFile = (file) => {
        if (!file) return;

        setUploadStatus({ type: 'info', message: 'Reading and parsing file...' });

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (!jsonRows || jsonRows.length === 0) {
              setUploadStatus({ type: 'error', message: 'File is empty or invalid format.' });
              return;
            }

            // Standardizing properties
            const parsedMaterials = jsonRows.map((row, index) => {
              const getVal = (keys) => {
                for (let k of keys) {
                  const foundKey = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
                  if (foundKey && row[foundKey] !== undefined) return row[foundKey];
                }
                return '';
              };

              const code = String(getVal(['Material Code', 'Code', 'Item Code', 'MaterialNo']) || `MAT-${10000 + index}`);
              const name = String(getVal(['Material Name', 'Name', 'Description', 'Item Name']) || 'Unnamed Material');
              
              return {
                id: code,
                materialCode: code,
                materialName: name,
                vendorNumber: String(getVal(['Vendor Number', 'Vendor ID', 'VendorNo']) || 'VND-000'),
                vendorName: String(getVal(['Vendor Name', 'Vendor', 'Supplier']) || 'General Supplier'),
                origin: String(getVal(['Origin', 'Country', 'Source']) || 'Vietnam'),
                packingSize: String(getVal(['Packing Size', 'Packing', 'Unit']) || 'Standard Pack'),
                shelfLife: Number(getVal(['Shelf Life', 'ShelfLife (Days)'])) || 365,
                currentPrice: Number(getVal(['Unit Price', 'Current Price', 'Price', 'Cost'])) || 0,
                moq: Number(getVal(['MOQ', 'Minimum Order'])) || 100,
                leadTimeFC: Number(getVal(['Lead Time FC', 'LT FC', 'Lead Time FC (Days)'])) || 14,
                leadTimeNonFC: Number(getVal(['Lead Time Non-FC', 'LT Non-FC', 'Lead Time Non-FC (Days)'])) || 30,
                lastUpdateDate: new Date().toISOString().split('T')[0],
                additionalNotes: String(getVal(['Additional Notes', 'Notes', 'Remark']) || 'Imported via Excel'),
                category: String(getVal(['Category', 'Group']) || 'General'),
                currentStock: Number(getVal(['Current Stock', 'Stock'])) || 500,
                monthlyConsumption: Number(getVal(['Monthly Consumption', 'Consumption'])) || 100,
                safetyStock: Number(getVal(['Safety Stock'])) || 50,
                forecastDemand: Number(getVal(['Forecast Demand'])) || 120
              };
            });

            setMaterials(parsedMaterials);
            if (parsedMaterials.length > 0) {
              setCalcMaterial(parsedMaterials[0]);
            }

            setUploadStatus({
              type: 'success',
              message: `Successfully imported ${parsedMaterials.length} materials from file "${file.name}"!`
            });
          } catch (err) {
            console.error(err);
            setUploadStatus({ type: 'error', message: 'Failed to process file. Ensure it is a valid .xlsx or .csv.' });
          }
        };

        reader.readAsArrayBuffer(file);
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        processFile(file);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = () => {
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      const handleExportCSV = () => {
        const headers = [
          'Material Code,Material Name,Vendor Number,Vendor Name,Origin,Packing Size,Shelf Life (Days),Current Price ($),MOQ,Lead Time FC (Days),Lead Time Non-FC (Days),Last Update Date,Additional Notes'
        ];
        const rows = filteredMaterials.map(m => [
          `"${m.materialCode}"`,
          `"${m.materialName.replace(/"/g, '""')}"`,
          `"${m.vendorNumber}"`,
          `"${m.vendorName}"`,
          `"${m.origin}"`,
          `"${m.packingSize}"`,
          m.shelfLife,
          m.currentPrice,
          m.moq,
          m.leadTimeFC,
          m.leadTimeNonFC,
          `"${m.lastUpdateDate}"`,
          `"${(m.additionalNotes || '').replace(/"/g, '""')}"`
        ].join(','));

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers, ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `Material_Master_Data_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const openCalculatorForMaterial = (mat) => {
        setCalcMaterial(mat);
        setCalcInputs(prev => ({
          ...prev,
          leadTimeFC: mat.leadTimeFC,
          leadTimeNonFC: mat.leadTimeNonFC
        }));
        setActiveTab('calculator');
      };

      const calculatedLeadTimes = useMemo(() => {
        const getOrderDate = (deliveryDateStr, days) => {
          if (!deliveryDateStr) return 'N/A';
          const d = new Date(deliveryDateStr);
          d.setDate(d.getDate() - Number(days || 0));
          return d.toISOString().split('T')[0];
        };

        const suggestedFC = getOrderDate(calcInputs.requestedDeliveryDate, calcInputs.leadTimeFC);
        const suggestedNonFC = getOrderDate(calcInputs.requestedDeliveryDate, calcInputs.leadTimeNonFC);

        let actualLeadtime = 0;
        let daysDiff = 0;
        let isShortLeadtime = false;
        let targetStandardLeadtime = calcInputs.orderType === 'FC' ? calcInputs.leadTimeFC : calcInputs.leadTimeNonFC;

        if (calcInputs.requestedDeliveryDate && calcInputs.actualPrReceivedDate) {
          const deliveryDate = new Date(calcInputs.requestedDeliveryDate);
          const prDate = new Date(calcInputs.actualPrReceivedDate);
          const diffTime = deliveryDate.getTime() - prDate.getTime();
          actualLeadtime = Math.round(diffTime / (1000 * 3600 * 24));
          
          isShortLeadtime = actualLeadtime < targetStandardLeadtime;
          daysDiff = actualLeadtime - targetStandardLeadtime;
        }

        return {
          suggestedFC,
          suggestedNonFC,
          actualLeadtime,
          targetStandardLeadtime,
          isShortLeadtime,
          daysDiff
        };
      }, [calcInputs]);

      return (
        <div className={`min-h-screen transition-colors duration-200 ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
          
          {/* Header Navigation */}
          <header className="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 lg:px-8 py-3">
            <div className="flex flex-col md:flex-row items-center justify-between gap-4 max-w-7xl mx-auto">
              
              <div className="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
                <div className="flex items-center space-x-3">
                  <div className="p-2.5 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl text-white shadow-lg shadow-blue-500/20">
                    <Icon name="box" className="w-6 h-6" />
                  </div>
                  <div>
                    <h1 className="text-lg font-bold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent">
                      SPD FOOD
                    </h1>
                    <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                      Raw Material Master Data
                    </p>
                  </div>
                </div>

                <div className="flex md:hidden items-center space-x-2">
                  <button
                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                    className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                  >
                    {theme === 'dark' ? <Icon name="sun" className="w-4 h-4" /> : <Icon name="moon" className="w-4 h-4" />}
                  </button>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="flex items-center space-x-1 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                {[
                  { id: 'directory', label: 'Master Directory', icon: 'layers' },
                  { id: 'calculator', label: 'Lead Time Calculation', icon: 'calculator' },
                  { id: 'excel', label: 'Source', icon: 'file-spreadsheet' },
                  { id: 'docs', label: 'System Specs & APIs', icon: 'terminal' }
                ].map((tab) => {
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                        isActive
                          ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                          : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                      }`}
                    >
                      <Icon name={tab.icon} className="w-4 h-4" />
                      <span>{tab.label}</span>
                    </button>
                  );
                })}
              </nav>

              {/* Controls */}
              <div className="hidden md:flex items-center space-x-3">
                <div className="flex items-center space-x-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                  <Icon name="shield-check" className="w-4 h-4 text-blue-500" />
                  <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">Role:</span>
                  <select
                    value={userRole}
                    onChange={(e) => setUserRole(e.target.value)}
                    className="bg-transparent text-xs font-bold text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer"
                  >
                    <option value="Admin">Admin (Full)</option>
                    <option value="Procurement User">Procurement</option>
                    <option value="Viewer">Viewer (Read Only)</option>
                  </select>
                </div>

                <button
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                  title="Toggle Theme"
                >
                  {theme === 'dark' ? <Icon name="sun" className="w-4 h-4 text-amber-400" /> : <Icon name="moon" className="w-4 h-4 text-slate-600" />}
                </button>
              </div>

            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-7xl mx-auto px-4 lg:px-8 py-6">

            {/* TAB 1: MASTER DIRECTORY */}
            {activeTab === 'directory' && (
              <div className="space-y-6">
                <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                  <div className="flex flex-col lg:flex-row items-center justify-between gap-4">
                    <div className="relative w-full lg:w-96">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        placeholder="Search Code, Material Name, Vendor..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-8 py-2 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100"
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                          <Icon name="x" className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>

                    <div className="flex items-center space-x-2 w-full lg:w-auto justify-end">
                      <button
                        onClick={handleExportCSV}
                        className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl flex items-center space-x-1.5 shadow-md shadow-emerald-500/10 transition-all"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>Export CSV / Excel</span>
                      </button>

                      {userRole === 'Admin' && (
                        <button
                          onClick={() => setActiveTab('excel')}
                          className="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl flex items-center space-x-1.5 shadow-md shadow-blue-500/10 transition-all"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5" />
                          <span>Import Excel</span>
                        </button>
                      )}

                      <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                        <button
                          onClick={() => setViewMode('table')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${viewMode === 'table' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-500'}`}
                        >
                          Table
                        </button>
                        <button
                          onClick={() => setViewMode('grid')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${viewMode === 'grid' ? 'bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm' : 'text-slate-500'}`}
                        >
                          Grid
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Filter Vendor</label>
                      <select
                        value={selectedVendor}
                        onChange={(e) => setSelectedVendor(e.target.value)}
                        className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      >
                        {vendorsList.map(v => <option key={v} value={v}>{v}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Filter Origin</label>
                      <select
                        value={selectedOrigin}
                        onChange={(e) => setSelectedOrigin(e.target.value)}
                        className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      >
                        {originList.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Sort By</label>
                      <select
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                        className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs p-2 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500"
                      >
                        <option value="code">Item No. (A-Z)</option>
                        <option value="name">Item Name (A-Z)</option>
                        <option value="priceAsc">Price: Low to High</option>
                        <option value="priceDesc">Price: High to Low</option>
                        <option value="ltAsc">Lead Time FC: Shortest First</option>

            {/* TAB 4: SYSTEM SPECS */}
            {activeTab === 'docs' && (
              <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <h2 className="text-base font-bold flex items-center space-x-2">
                  <Icon name="terminal" className="w-5 h-5 text-indigo-500" />
                  <span>System Architecture & API Specifications</span>
                </h2>
                <p className="text-xs text-slate-400">
                  Documentation for PostgreSQL Schema, API endpoints, and scalable backend design.
                </p>
                <div className="p-4 bg-slate-950 font-mono text-xs rounded-xl text-emerald-400 overflow-x-auto">
                  <pre>{`
-- Material Master Table Schema
CREATE TABLE material_master (
    material_code VARCHAR(50) PRIMARY KEY,
    material_name VARCHAR(255) NOT NULL,
    vendor_number VARCHAR(50),
    vendor_name VARCHAR(255),
    origin VARCHAR(100),
    packing_size VARCHAR(100),
    shelf_life INT,
    current_price DECIMAL(12,2),
    moq INT,
    lead_time_fc INT,
    lead_time_non_fc INT,
    last_update_date DATE,
    additional_notes TEXT
);
                  `}</pre>
                </div>
              </div>
            )}

          </main>

          {/* DETAIL MODAL */}
          {isDetailOpen && selectedMaterial && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-2xl w-full space-y-5 shadow-2xl text-slate-100">
                <div className="flex items-start justify-between">
                  <div>
                    <span className="font-mono text-xs font-bold text-blue-400 bg-blue-950/80 border border-blue-800/50 px-2.5 py-1 rounded-md">
                      {selectedMaterial.materialCode}
                    </span>
                    <h2 className="text-xl font-bold mt-2 text-slate-50">
                      {selectedMaterial.materialName}
                    </h2>
                  </div>
                  <button 
                    onClick={() => setIsDetailOpen(false)} 
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 transition-colors"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-slate-800/40 border border-slate-800 p-4 rounded-xl space-y-2">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                      VENDOR & ORIGIN
                    </span>
                    <h3 className="font-bold text-sm text-slate-100">
                      {selectedMaterial.vendorName}
                    </h3>
                    <div className="text-xs text-slate-400 space-y-1">
                      <p>Vendor ID: <span className="text-slate-300">{selectedMaterial.vendorNumber}</span></p>
                      <p>Country of Origin: <span className="text-slate-300">{selectedMaterial.origin}</span></p>
                      <p>Packing: <span className="text-slate-300">{selectedMaterial.packingSize}</span></p>
                    </div>
                  </div>

                  <div className="bg-slate-800/40 border border-slate-800 p-4 rounded-xl space-y-2">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                      COMMERCIAL METRICS
                    </span>
                    <div className="text-xl font-bold text-emerald-400">
                      ${selectedMaterial.currentPrice.toFixed(2)} <span className="text-xs font-normal text-slate-400">/ unit</span>
                    </div>
                    <div className="text-xs text-slate-400 space-y-1 pt-1">
                      <p>MOQ: <span className="text-slate-300">{selectedMaterial.moq.toLocaleString()} pcs</span></p>
                      <p>Shelf Life: <span className="text-slate-300">{selectedMaterial.shelfLife} Days</span></p>
                      <p>Last Modified: <span className="text-slate-300">{selectedMaterial.lastUpdateDate}</span></p>
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    onClick={() => setIsDetailOpen(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition-colors"
                  >
                    Close Window
                  </button>

                  <button
                    onClick={() => {
                      setIsDetailOpen(false);
                      openCalculatorForMaterial(selectedMaterial);
                    }}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg flex items-center space-x-1.5 shadow-md shadow-blue-500/20 transition-all"
                  >
                    <Icon name="calculator" className="w-4 h-4" />
                    <span>Calculate Order Dates</span>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
